<style>
:root{
  --paper:#F1E8DB;--surface:#FFFDF9;--surface-2:#F7F0E6;--ink:#33353C;--slate:#6A6560;--rule:#E4D9C9;
  --accent:#5F259F;--accent-soft:#EFE7F7;--mark:#FFE7A3;--mark-line:#D98A2B;--shadow:0 1px 2px rgba(51,53,60,.06),0 4px 14px rgba(51,53,60,.06);
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --head:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#24211E;--surface:#2E2A26;--surface-2:#38332E;--ink:#F1E8DB;--slate:#BDB3A6;--rule:#463F38;
  --accent:#C3A6E6;--accent-soft:rgba(195,166,230,.16);--mark:rgba(255,200,90,.28);--mark-line:#F0B35A;--shadow:none;}}
:root[data-theme="dark"]{--paper:#24211E;--surface:#2E2A26;--surface-2:#38332E;--ink:#F1E8DB;--slate:#BDB3A6;--rule:#463F38;
  --accent:#C3A6E6;--accent-soft:rgba(195,166,230,.16);--mark:rgba(255,200,90,.28);--mark-line:#F0B35A;--shadow:none;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header{padding:48px 0 30px}
h1{font-family:var(--head);font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:1.25;margin:0 0 8px;letter-spacing:.02em}
h1 .dot{color:var(--accent)}
.lead{color:var(--slate);margin:0 0 24px;max-width:60ch;font-size:15px}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:6px 8px 6px 20px;max-width:720px;box-shadow:var(--shadow);transition:border-color .15s}
.search svg{flex:none;color:var(--accent)}
.search input{flex:1;border:0;background:transparent;font-size:17px;padding:10px 0;min-width:0}
.search input::placeholder{color:var(--slate);opacity:.8}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
.hint{font-size:13px;color:var(--slate);margin:10px 0 0 20px}

.layout{display:grid;grid-template-columns:264px 1fr;gap:28px;padding:4px 0 64px}
aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:20px 16px 8px;box-shadow:var(--shadow)}
.facet{margin-bottom:22px}
.facet h2{font-family:var(--head);font-weight:700;font-size:14px;margin:0 0 8px 4px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.03em}
.facet h2 small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--slate)}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;position:relative;margin-bottom:2px}
.opt:hover{background:var(--surface-2)}
.opt .lbl{position:relative;z-index:1;font-size:14px}
.opt .n{position:relative;z-index:1;font-size:12px;color:var(--slate);font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--surface-2);border-radius:8px;transition:width .25s ease}
.opt[aria-pressed="true"]{background:var(--accent-soft)}
.opt[aria-pressed="true"] .bar{background:transparent}
.opt[aria-pressed="true"] .lbl{font-weight:700;color:var(--accent)}
.opt[aria-pressed="true"] .n{color:var(--accent);font-weight:700}
.opt:disabled{opacity:.38;cursor:default}
.opt:disabled:hover{background:none}
.mode{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;margin:0 0 8px 4px}
.mode button{border:0;background:none;padding:2px 12px;font-size:12px;cursor:pointer;color:var(--slate);border-radius:999px}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters-toggle{display:none}

.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px;min-height:40px}
.count{font-family:var(--head);font-weight:700;font-size:22px;line-height:1}
.count span{font-size:13px;font-weight:500;color:var(--slate);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:0;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.chip:hover{filter:brightness(.97)}
.act{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:13px;cursor:pointer}
.act:hover{border-color:var(--accent);color:var(--accent)}

ol.results{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.item{background:var(--surface);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px 32px}
.head{grid-column:1/2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.item h3{font-family:var(--head);font-weight:700;font-size:18px;margin:0;line-height:1.45}
.badge{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.meta{grid-column:2/3;grid-row:1/4;font-size:12.5px;color:var(--slate);line-height:1.65;border-left:1px solid var(--rule);padding-left:20px}
.meta .lab{display:block;font-size:11px;letter-spacing:.06em;color:var(--slate);opacity:.85;margin-top:8px}
.meta .lab:first-child{margin-top:0}
.meta .val{color:var(--ink);font-size:13px}
.meta .sup{display:inline-block;margin-top:4px;font-size:11px;color:var(--slate);background:var(--surface-2);border-radius:4px;padding:0 6px}
.meta a{display:inline-flex;align-items:center;gap:4px;margin-top:12px;color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
.meta a:hover{text-decoration:underline}
.ch{grid-column:1/2;margin:2px 0 0;padding:0;list-style:none;counter-reset:c}
.ch li{position:relative;padding-left:30px;margin:6px 0;max-width:66ch}
.ch li::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:11px;font-weight:700;line-height:20px;text-align:center}
.tags{grid-column:1/2;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;border:0;background:var(--surface-2);border-radius:999px;padding:2px 11px;cursor:pointer;color:var(--ink)}
.tag:hover{background:var(--accent-soft);color:var(--accent)}
.tag.on{background:var(--accent);color:var(--surface);font-weight:700}
mark{background:var(--mark);color:inherit;box-shadow:inset 0 -2px 0 var(--mark-line);padding:0 1px;border-radius:2px}
.empty{background:var(--surface);border-radius:16px;padding:40px 28px;color:var(--slate);box-shadow:var(--shadow)}
.empty strong{display:block;color:var(--ink);font-family:var(--head);font-size:18px;margin-bottom:6px}
footer{padding:8px 0 48px;font-size:12.5px;color:var(--slate)}
footer p{margin:4px 0;max-width:84ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:860px){
  header{padding:32px 0 22px}
  .layout{grid-template-columns:1fr;gap:12px}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .filters-toggle{display:inline-block}
  .item{grid-template-columns:1fr;padding:18px}
  .meta{grid-column:1;grid-row:auto;border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.theme{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:24px;display:inline-flex;background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:3px}

.theme button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
header .wrap{position:relative}
@media (max-width:860px){.theme{position:static;margin-bottom:16px}}
</style>
</head>

</footer>

  const res=DATA.filter(d=>match(d));
  const tsv=["会社名\t企業規模\t業種\t主な課題１\t主な課題２\t主な課題３\t課題タグ\t出典URL",...res.map(d=>[d.name,d.size,`${d.ind}（${d.indCode}）／${d.indDetail}`,...d.c,d.tags.join("、"),d.url].join("\t"))].join("\n");
  try{await navigator.clipboard.writeText(tsv);toast(`${res.length}件をコピーしました。Excelに貼り付けられます`)}
  catch{toast("コピーできませんでした。ブラウザの権限を確認してください")}
};
function applyTheme(m){
  const r=document.documentElement;
  if(m==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",m);
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===m));
  try{localStorage.setItem("finder-theme",m)}catch(e){}
}
let savedTheme="light";try{savedTheme=localStorage.getItem("finder-theme")||"light"}catch(e){}
applyTheme(savedTheme);
document.querySelectorAll("[data-theme-set]").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.themeSet)));
render();
</script>
</body>
